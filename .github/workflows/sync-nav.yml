name: Sync NAV from AMFI

# Runs hourly, on the hour (UTC). AMFI publishes NAV once per business day, so
# most runs are idempotent no-ops (sync uses ON CONFLICT DO NOTHING); hourly just
# guarantees we pick up the daily file soon after it lands, whatever time that is.
# GitHub may delay scheduled runs under load, so treat the cadence as "about hourly".

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/sync-nav
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_NAV_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/sync-nav" | jq .
